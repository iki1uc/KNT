<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>((KNT)) · Möglichkeitsebene · Cube‑Mind‑Sender</title>

<style>
body { background:#000; color:#0f0; font-family:Consolas, monospace; padding:40px; }
h1 { color:#0ff; }
pre { background:#111; padding:20px; border-left:4px solid #0ff; white-space:pre-wrap; }
#kntBox {
    width: 360px;
    height: 360px;
    margin: 40px auto;
    border: 3px solid #0ff;
    border-radius: 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:48px;
    color:#ff0;
    text-shadow:0 0 12px #ff0;
}
</style>
</head>

<body>

<h1>((KNT)) · Möglichkeitsebene · Cube‑Mind‑Sender</h1>

<div id="kntBox">KNT</div>

<pre id="out">Lade KNT‑Engine…</pre>

<script type="module">
import { CUBE_MIND } from "../CUBE-MIND/MASTER/CUBE_MIND.js";
import { SYNC } from "../CUBE-MIND/SYNC/SYNC.js";

// ------------------------------------------------------
// KNT = Möglichkeitsebene (120°‑Achse)
// ------------------------------------------------------
function KNT_AXIS(frame){
    return {
        angle: (frame * 120) % 360,
        x: Math.cos((frame * 120) * Math.PI/180),
        y: Math.sin((frame * 120) * Math.PI/180),
        state: "könnte"
    };
}

// ------------------------------------------------------
// KNT sendet → Cube‑Mind empfängt
// ------------------------------------------------------
async function KNT_SEND(frame){
    const axis = KNT_AXIS(frame);
    const mind = await SYNC.slow(() => CUBE_MIND(frame));

    return {
        frame,
        axis,
        mind,
        send: {
            from: "KNT",
            to: "CUBE‑MIND",
            payload: axis.state,
            tcy: mind.tcy
        }
    };
}

// ------------------------------------------------------
// ENGINE
// ------------------------------------------------------
let frame = 0;

async function ENGINE(){

    const pkg = await KNT_SEND(frame);

    // Visualisierung
    const box = document.getElementById("kntBox");
    box.textContent = pkg.axis.state;
    box.style.transform = `rotate(${pkg.axis.angle}deg) scale(${1 + pkg.mind.tcy/10})`;
    box.style.color = pkg.mind.tcy % 2 === 0 ? "#0f0" : "#ff0";

    // Ausgabe
    document.getElementById("out").textContent =
        JSON.stringify(pkg, null, 2);

    frame++;
    requestAnimationFrame(ENGINE);
}

ENGINE();
</script>

</body>
</html>
